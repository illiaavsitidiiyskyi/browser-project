<!DOCTYPE html>
<html>
<head>
  <title>Settings</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --text: #eee;
      --muted: #999;
      --input-bg: #2a2a2a;
      --border: #444;
    }
    :root[data-theme="light"] {
      --bg: #ffffff;
      --text: #222;
      --muted: #666;
      --input-bg: #f5f5f5;
      --border: #ccc;
    }
    body {
      margin: 0;
      font-family: sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    h1 {
      font-weight: 300;
    }
    .field {
      margin: 20px 0;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input {
      width: 400px;
      height: 36px;
      font-size: 14px;
      padding: 0 10px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
    }
    button {
      margin-top: 12px;
      height: 36px;
      padding: 0 16px;
      cursor: pointer;
      border: none;
      border-radius: 4px;
      background: #3a7bd5;
      color: white;
      font-size: 14px;
    }
    .saved {
      color: #4caf50;
      font-size: 13px;
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <h1>Settings</h1>
  <div class="field">
    <label>Homepage (used for new tabs, leave empty for default start page)</label>
    <input id="homepage" type="text" placeholder="https://example.com" />
    <div>
      <button id="save">Save</button>
      <span id="saved-msg" class="saved" style="display:none;">Saved</span>
    </div>
  </div>
  <script>
    window.browserAPI.getSettings().then(settings => {
      document.getElementById('homepage').value = settings.homepage || '';
      document.documentElement.setAttribute('data-theme', settings.theme || 'light');
    });

    window.browserAPI.onThemeUpdated((theme) => {
      document.documentElement.setAttribute('data-theme', theme);
    });

    document.getElementById('save').addEventListener('click', () => {
      const homepage = document.getElementById('homepage').value.trim();
      window.browserAPI.saveSettings({ homepage: homepage || null });

      const msg = document.getElementById('saved-msg');
      msg.style.display = 'inline';
      setTimeout(() => { msg.style.display = 'none'; }, 1500);
    });
  </script>
</body>
</html>
