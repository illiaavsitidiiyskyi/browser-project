<!DOCTYPE html>
<html>
<head>
  <title>History</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --text: #eee;
      --muted: #999;
      --border: #333;
      --hover: #2a2a2a;
    }
    :root[data-theme="light"] {
      --bg: #ffffff;
      --text: #222;
      --muted: #666;
      --border: #ddd;
      --hover: #f5f5f5;
    }
    body {
      margin: 0;
      font-family: sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
    }
    h1 {
      font-weight: 300;
    }
    .entry {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .entry:hover {
      background: var(--hover);
    }
    .entry .title {
      font-size: 14px;
    }
    .entry .url {
      font-size: 12px;
      color: var(--muted);
    }
    .entry .time {
      font-size: 11px;
      color: var(--muted);
      float: right;
    }
  </style>
</head>
<body>
  <h1>History</h1>
  <div id="list"></div>
  <script>
    window.browserAPI.getSettings().then(settings => {
      document.documentElement.setAttribute('data-theme', settings.theme || 'light');
    });

    window.browserAPI.onThemeUpdated((theme) => {
      document.documentElement.setAttribute('data-theme', theme);
    });

    function loadHistory() {
      window.browserAPI.getHistory().then(history => {
        const list = document.getElementById('list');
        list.innerHTML = '';
        history.forEach(entry => {
          const el = document.createElement('div');
          el.className = 'entry';
          const time = new Date(entry.timestamp).toLocaleString();
          el.innerHTML = `
            <span class="time">${time}</span>
            <div class="title">${entry.title || entry.url}</div>
            <div class="url">${entry.url}</div>
          `;
          el.addEventListener('click', () => {
            window.location.href = entry.url;
          });
          list.appendChild(el);
        });
      });
    }

    loadHistory();
    window.browserAPI.onHistoryUpdated(() => loadHistory());
  </script>
</body>
</html>
