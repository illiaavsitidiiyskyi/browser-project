<!DOCTYPE html>
<html>
<head>
  <title>Browser</title>
  <style>
    body { margin: 0; padding: 0; }
    #toolbar {
      height: 80px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      background: #f0f0f0;
      box-sizing: border-box;
    }
    #address {
      flex: 1;
      height: 36px;
      font-size: 14px;
      padding: 0 10px;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <input id="address" type="text" placeholder="Enter URL" />
  </div>
  <script>
    const input = document.getElementById('address');
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        let url = input.value;
        if (!url.startsWith('http')) {
          url = 'https://' + url;
        }
        window.browserAPI.navigate(url);
      }
    });
  </script>
</body>
</html>
