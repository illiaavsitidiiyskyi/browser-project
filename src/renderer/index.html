<!DOCTYPE html>
<html>
<head>
  <title>Browser</title>
  <style>
    :root {
      --bg-tabbar: #ddd;
      --bg-tab: #f5f5f5;
      --bg-tab-active: white;
      --bg-toolbar: #f0f0f0;
      --text-color: #222;
      --bg-address: white;
      --border-color: #ccc;
    }
    :root[data-theme="dark"] {
      --bg-tabbar: #2a2a2a;
      --bg-tab: #333;
      --bg-tab-active: #444;
      --bg-toolbar: #262626;
      --text-color: #eee;
      --bg-address: #333;
      --border-color: #444;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: var(--bg-toolbar);
    }
    #tabbar {
      height: 36px;
      display: flex;
      align-items: center;
      background: var(--bg-tabbar);
      padding: 0 4px;
      gap: 4px;
      box-sizing: border-box;
      position: relative;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: var(--bg-tab);
      color: var(--text-color);
      border-radius: 6px 6px 0 0;
      font-size: 12px;
      cursor: pointer;
      max-width: 160px;
      user-select: none;
      touch-action: none;
    }
    .tab.active {
      background: var(--bg-tab-active);
      font-weight: bold;
    }
    .tab.private {
      background: #4a2f6b;
      color: #eee;
    }
    .tab.private.active {
      background: #6b3fa0;
    }
    .tab.dragging {
      opacity: 0.4;
    }
    .tab.drag-over {
      border-left: 2px solid #3a7bd5;
    }
    .tab span.title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tab .close {
      color: #999;
    }
    #new-tab {
      cursor: pointer;
      padding: 4px 10px;
      font-size: 16px;
      color: var(--text-color);
    }
    #new-private-tab {
      cursor: pointer;
      padding: 4px 8px;
      font-size: 14px;
      color: var(--text-color);
    }
    #toolbar {
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      background: var(--bg-toolbar);
      box-sizing: border-box;
      gap: 6px;
    }
    #toolbar button {
      height: 30px;
      width: 30px;
      font-size: 14px;
      cursor: pointer;
      background: var(--bg-address);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }
    #bookmark.active {
      color: #f5b400;
    }
    #address {
      flex: 1;
      height: 32px;
      font-size: 14px;
      padding: 0 10px;
      background: var(--bg-address);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="tabbar">
    <div id="new-tab" title="New Tab">+</div>
    <div id="new-private-tab" title="New Private Tab">🕵</div>
  </div>
  <div id="toolbar">
    <button id="back" title="Back">←</button>
    <button id="forward" title="Forward">→</button>
    <button id="reload" title="Reload">⟳</button>
    <button id="bookmark" title="Bookmark this page">☆</button>
    <button id="bookmarks-page" title="Open Bookmarks">★</button>
    <button id="history" title="Open History">☰</button>
    <button id="theme-toggle" title="Toggle theme">🌙</button>
    <button id="settings" title="Open Settings">⚙</button>
    <input id="address" type="text" placeholder="Enter URL" />
  </div>
  <script>
    const tabbar = document.getElementById('tabbar');
    const newTabBtn = document.getElementById('new-tab');
    const newPrivateTabBtn = document.getElementById('new-private-tab');
    const address = document.getElementById('address');
    const bookmarkBtn = document.getElementById('bookmark');
    const themeToggleBtn = document.getElementById('theme-toggle');

    let draggedIndex = null;
    let isDragging = false;
    let dragStartX = 0;
    const DRAG_THRESHOLD = 5;

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      themeToggleBtn.textContent = theme === 'dark' ? '☀' : '🌙';
    }

    window.browserAPI.getSettings().then(settings => {
      applyTheme(settings.theme || 'light');
    });

    window.browserAPI.onThemeUpdated((theme) => {
      applyTheme(theme);
    });

    themeToggleBtn.addEventListener('click', () => {
      window.browserAPI.toggleTheme();
    });

    newTabBtn.addEventListener('click', () => window.browserAPI.newTab());
    newPrivateTabBtn.addEventListener('click', () => window.browserAPI.newPrivateTab());

    document.getElementById('back').addEventListener('click', () => window.browserAPI.goBack());
    document.getElementById('forward').addEventListener('click', () => window.browserAPI.goForward());

    document.getElementById('reload').addEventListener('click', () => {
      const btn = document.getElementById('reload');
      if (btn.textContent === '✕') {
        window.browserAPI.stopLoading();
      } else {
        window.browserAPI.reload();
      }
    });

    document.getElementById('history').addEventListener('click', () => {
      window.browserAPI.navigate('src/renderer/history.html');
    });

    document.getElementById('bookmarks-page').addEventListener('click', () => {
      window.browserAPI.navigate('src/renderer/bookmarks.html');
    });

    document.getElementById('settings').addEventListener('click', () => {
      window.browserAPI.navigate('src/renderer/settings.html');
    });

    bookmarkBtn.addEventListener('click', () => {
      window.browserAPI.toggleBookmark();
    });

    address.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        let value = address.value.trim();
        let url;
        if (value.includes('.') && !value.includes(' ')) {
          url = value.startsWith('http') ? value : 'https://' + value;
        } else {
          url = 'https://www.google.com/search?q=' + encodeURIComponent(value);
        }
        window.browserAPI.navigate(url);
      }
    });

    function getTabIndexAtPoint(x, y) {
      const tabs = Array.from(document.querySelectorAll('.tab'));
      for (const t of tabs) {
        const rect = t.getBoundingClientRect();
        if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
          return parseInt(t.dataset.index, 10);
        }
      }
      return null;
    }

    window.browserAPI.onTabsUpdated((tabs) => {
      document.querySelectorAll('.tab').forEach(el => el.remove());

      tabs.forEach(tab => {
        const el = document.createElement('div');
        el.className = 'tab' + (tab.active ? ' active' : '') + (tab.isPrivate ? ' private' : '');
        el.dataset.index = tab.index;
        const prefix = tab.isPrivate ? '🕵 ' : '';
        el.innerHTML = `<span class="title">${prefix}${tab.title}</span><span class="close">x</span>`;

        el.addEventListener('pointerdown', (e) => {
          if (e.target.closest('.close')) return;
          draggedIndex = tab.index;
          dragStartX = e.clientX;
          isDragging = false;
          el.setPointerCapture(e.pointerId);
        });

        el.addEventListener('pointermove', (e) => {
          if (draggedIndex === null || draggedIndex !== tab.index) return;

          if (!isDragging && Math.abs(e.clientX - dragStartX) > DRAG_THRESHOLD) {
            isDragging = true;
            el.classList.add('dragging');
          }

          if (isDragging) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('drag-over'));
            const overIndex = getTabIndexAtPoint(e.clientX, e.clientY);
            if (overIndex !== null && overIndex !== draggedIndex) {
              const overEl = document.querySelector(`.tab[data-index="${overIndex}"]`);
              if (overEl) overEl.classList.add('drag-over');
            }
          }
        });

        el.addEventListener('pointerup', (e) => {
          if (draggedIndex === null || draggedIndex !== tab.index) return;

          if (isDragging) {
            const dropIndex = getTabIndexAtPoint(e.clientX, e.clientY);
            if (dropIndex !== null && dropIndex !== draggedIndex) {
              window.browserAPI.reorderTabs(draggedIndex, dropIndex);
            }
          } else {
            window.browserAPI.switchTab(tab.index);
          }

          document.querySelectorAll('.tab').forEach(t => {
            t.classList.remove('dragging');
            t.classList.remove('drag-over');
          });

          draggedIndex = null;
          isDragging = false;
        });

        el.querySelector('.close').addEventListener('click', (e) => {
          e.stopPropagation();
          window.browserAPI.closeTab(tab.index);
        });

        if (tab.active) {
          address.value = tab.url;
          bookmarkBtn.textContent = tab.isBookmarked ? '★' : '☆';
          bookmarkBtn.className = tab.isBookmarked ? 'active' : '';
        }

        tabbar.insertBefore(el, newTabBtn);
      });
    });

    window.browserAPI.onLoadingState((loading) => {
      document.getElementById('reload').textContent = loading ? '✕' : '⟳';
    });
  </script>
</body>
</html>
