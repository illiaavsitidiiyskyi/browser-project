<!DOCTYPE html>
<html>
<head>
  <title>Browser</title>
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #tabbar {
      height: 36px;
      display: flex;
      align-items: center;
      background: #ddd;
      padding: 0 4px;
      gap: 4px;
      box-sizing: border-box;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: #f5f5f5;
      border-radius: 6px 6px 0 0;
      font-size: 12px;
      cursor: pointer;
      max-width: 160px;
    }
    .tab.active {
      background: white;
      font-weight: bold;
    }
    .tab span.title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tab .close {
      color: #999;
    }
    #new-tab {
      cursor: pointer;
      padding: 4px 10px;
      font-size: 16px;
    }
    #toolbar {
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      background: #f0f0f0;
      box-sizing: border-box;
    }
    #address {
      flex: 1;
      height: 32px;
      font-size: 14px;
      padding: 0 10px;
    }
  </style>
</head>
<body>
  <div id="tabbar">
    <div id="new-tab">+</div>
  </div>
  <div id="toolbar">
    <input id="address" type="text" placeholder="Enter URL" />
  </div>
  <script>
    const tabbar = document.getElementById('tabbar');
    const newTabBtn = document.getElementById('new-tab');
    const address = document.getElementById('address');

    newTabBtn.addEventListener('click', () => window.browserAPI.newTab());

    address.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        let url = address.value;
        if (!url.startsWith('http')) url = 'https://' + url;
        window.browserAPI.navigate(url);
      }
    });

    window.browserAPI.onTabsUpdated((tabs) => {
      document.querySelectorAll('.tab').forEach(el => el.remove());

      tabs.forEach(tab => {
        const el = document.createElement('div');
        el.className = 'tab' + (tab.active ? ' active' : '');
        el.innerHTML = `<span class="title">${tab.url || 'New Tab'}</span><span class="close">x</span>`;

        el.querySelector('.title').addEventListener('click', () => {
          window.browserAPI.switchTab(tab.index);
        });

        el.querySelector('.close').addEventListener('click', (e) => {
          e.stopPropagation();
          window.browserAPI.closeTab(tab.index);
        });

        if (tab.active) address.value = tab.url;

        tabbar.insertBefore(el, newTabBtn);
      });
    });
  </script>
</body>
</html>
