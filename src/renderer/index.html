<!DOCTYPE html>
<html>
<head>
  <title>Browser</title>
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    #tabbar {
      height: 36px;
      display: flex;
      align-items: center;
      background: #ddd;
      padding: 0 4px;
      gap: 4px;
      box-sizing: border-box;
      position: relative;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: #f5f5f5;
      border-radius: 6px 6px 0 0;
      font-size: 12px;
      cursor: pointer;
      max-width: 160px;
      user-select: none;
      touch-action: none;
    }
    .tab.active {
      background: white;
      font-weight: bold;
    }
    .tab.dragging {
      opacity: 0.4;
    }
    .tab.drag-over {
      border-left: 2px solid #3a7bd5;
    }
    .tab span.title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tab .close {
      color: #999;
    }
    #new-tab {
      cursor: pointer;
      padding: 4px 10px;
      font-size: 16px;
    }
    #toolbar {
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      background: #f0f0f0;
      box-sizing: border-box;
      gap: 6px;
    }
    #toolbar button {
      height: 30px;
      width: 30px;
      font-size: 14px;
      cursor: pointer;
    }
    #bookmark.active {
      color: #f5b400;
    }
    #address {
      flex: 1;
      height: 32px;
      font-size: 14px;
      padding: 0 10px;
    }
  </style>
</head>
<body>
  <div id="tabbar">
    <div id="new-tab">+</div>
  </div>
  <div id="toolbar">
    <button id="back">←</button>
    <button id="forward">→</button>
    <button id="reload">⟳</button>
    <button id="bookmark">☆</button>
    <button id="bookmarks-page">★</button>
    <button id="history">☰</button>
    <button id="settings">⚙</button>
    <input id="address" type="text" placeholder="Enter URL" />
  </div>
  <script>
    const tabbar = document.getElementById('tabbar');
    const newTabBtn = document.getElementById('new-tab');
    const address = document.getElementById('address');
    const bookmarkBtn = document.getElementById('bookmark');

    let draggedIndex = null;
    let isDragging = false;
    let dragStartX = 0;
    const DRAG_THRESHOLD = 5;

    newTabBtn.addEventListener('click', () => window.browserAPI.newTab());

    document.getElementById('back').addEventListener('click', () => window.browserAPI.goBack());
    document.getElementById('forward').addEventListener('click', () => window.browserAPI.goForward());

    document.getElementById('reload').addEventListener('click', () => {
      const btn = document.getElementById('reload');
      if (btn.textContent === '✕') {
        window.browserAPI.stopLoading();
      } else {
        window.browserAPI.reload();
      }
    });

    document.getElementById('history').addEventListener('click', () => {
      window.browserAPI.navigate('src/renderer/history.html');
    });

    document.getElementById('bookmarks-page').addEventListener('click', () => {
      window.browserAPI.navigate('src/renderer/bookmarks.html');
    });

    document.getElementById('settings').addEventListener('click', () => {
      window.browserAPI.navigate('src/renderer/settings.html');
    });

    bookmarkBtn.addEventListener('click', () => {
      window.browserAPI.toggleBookmark();
    });

    address.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        let value = address.value.trim();
        let url;
        if (value.includes('.') && !value.includes(' ')) {
          url = value.startsWith('http') ? value : 'https://' + value;
        } else {
          url = 'https://www.google.com/search?q=' + encodeURIComponent(value);
        }
        window.browserAPI.navigate(url);
      }
    });

    function getTabIndexAtPoint(x, y) {
      const tabs = Array.from(document.querySelectorAll('.tab'));
      for (const t of tabs) {
        const rect = t.getBoundingClientRect();
        if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
          return parseInt(t.dataset.index, 10);
        }
      }
      return null;
    }

    window.browserAPI.onTabsUpdated((tabs) => {
      document.querySelectorAll('.tab').forEach(el => el.remove());

      tabs.forEach(tab => {
        const el = document.createElement('div');
        el.className = 'tab' + (tab.active ? ' active' : '');
        el.dataset.index = tab.index;
        el.innerHTML = `<span class="title">${tab.title}</span><span class="close">x</span>`;

        el.addEventListener('pointerdown', (e) => {
          if (e.target.closest('.close')) return;
          draggedIndex = tab.index;
          dragStartX = e.clientX;
          isDragging = false;
          el.setPointerCapture(e.pointerId);
        });

        el.addEventListener('pointermove', (e) => {
          if (draggedIndex === null || draggedIndex !== tab.index) return;

          if (!isDragging && Math.abs(e.clientX - dragStartX) > DRAG_THRESHOLD) {
            isDragging = true;
            el.classList.add('dragging');
          }

          if (isDragging) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('drag-over'));
            const overIndex = getTabIndexAtPoint(e.clientX, e.clientY);
            if (overIndex !== null && overIndex !== draggedIndex) {
              const overEl = document.querySelector(`.tab[data-index="${overIndex}"]`);
              if (overEl) overEl.classList.add('drag-over');
            }
          }
        });

        el.addEventListener('pointerup', (e) => {
          if (draggedIndex === null || draggedIndex !== tab.index) return;

          if (isDragging) {
            const dropIndex = getTabIndexAtPoint(e.clientX, e.clientY);
            if (dropIndex !== null && dropIndex !== draggedIndex) {
              window.browserAPI.reorderTabs(draggedIndex, dropIndex);
            }
          } else {
            window.browserAPI.switchTab(tab.index);
          }

          document.querySelectorAll('.tab').forEach(t => {
            t.classList.remove('dragging');
            t.classList.remove('drag-over');
          });

          draggedIndex = null;
          isDragging = false;
        });

        el.querySelector('.close').addEventListener('click', (e) => {
          e.stopPropagation();
          window.browserAPI.closeTab(tab.index);
        });

        if (tab.active) {
          address.value = tab.url;
          bookmarkBtn.textContent = tab.isBookmarked ? '★' : '☆';
          bookmarkBtn.className = tab.isBookmarked ? 'active' : '';
        }

        tabbar.insertBefore(el, newTabBtn);
      });
    });

    window.browserAPI.onLoadingState((loading) => {
      document.getElementById('reload').textContent = loading ? '✕' : '⟳';
    });
  </script>
</body>
</html>
