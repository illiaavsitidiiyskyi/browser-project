<!DOCTYPE html>
<html>
<head>
  <title>New Tab</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --text: #eee;
      --input-bg: white;
      --input-text: #222;
    }
    :root[data-theme="light"] {
      --bg: #ffffff;
      --text: #222;
      --input-bg: #f0f0f0;
      --input-text: #222;
    }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: sans-serif;
    }
    #center {
      text-align: center;
    }
    h1 {
      color: var(--text);
      font-weight: 300;
      font-size: 32px;
      margin-bottom: 24px;
    }
    #search {
      width: 400px;
      height: 44px;
      font-size: 15px;
      padding: 0 16px;
      border-radius: 22px;
      border: none;
      outline: none;
      background: var(--input-bg);
      color: var(--input-text);
    }
  </style>
</head>
<body>
  <div id="center">
    <h1>Browser</h1>
    <input id="search" type="text" placeholder="Search or enter address" autofocus />
  </div>
  <script>
    window.browserAPI.getSettings().then(settings => {
      document.documentElement.setAttribute('data-theme', settings.theme || 'light');
    });

    window.browserAPI.onThemeUpdated((theme) => {
      document.documentElement.setAttribute('data-theme', theme);
    });

    const input = document.getElementById('search');
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        let value = input.value.trim();
        let url;
        if (value.includes('.') && !value.includes(' ')) {
          url = value.startsWith('http') ? value : 'https://' + value;
        } else {
          url = 'https://www.google.com/search?q=' + encodeURIComponent(value);
        }
        window.location.href = url;
      }
    });
  </script>
</body>
</html>
